<!doctype html><html><head><meta charset="utf-8"><title>Ring v2</title><style>
:root{--bg-base:#0d0d0f}
[data-theme="light"]{--bg-base:#f0f4f3}
body{background:var(--bg-base);color:#e4e4e7;font-family:system-ui,sans-serif;margin:0;padding:24px;transition:background .2s}
[data-theme="light"] body{color:#0d1f1c}
h2{font-size:13px;font-weight:600;opacity:.65;margin:18px 0 10px}
.row{display:flex;gap:30px;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.lbl{font-size:10px;opacity:.55}
.rounded-full{border-radius:9999px}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#27272a;color:#a1a1aa;font-weight:700;font-size:26px}
button{margin-bottom:8px;padding:6px 12px;cursor:pointer}
/* ── Rang-Rahmen ────────────────────────────────────────────────────
   Aufbau:  .rank-ring     = Box mit Padding; das Padding IST der Ring
            .rr-ring-layer = rotierende Gradient-Schicht darunter
            .rr-face       = Bild-Container darüber, mit Haarlinien-Absatz
            .rr-dots       = Stufenanzeige (1–3 Punkte) am unteren Rand

   Die Rotation läuft über `transform` auf einer eigenen Schicht, nicht über einen
   per @property animierten Winkel im conic-gradient. Der Winkel-Ansatz muss jeden
   Frame neu malen; `transform` läuft im Compositor. Bei ~20 Avataren auf dem
   Leaderboard ist das der Unterschied zwischen dauerhafter CPU-Last und nahezu
   gratis — und der Ring wirkt sauberer, weil der Gradient nicht pro Frame neu
   gerastert wird (das erzeugte bei 2–3px Ringbreite sichtbares Banding).

   Farben kommen als rohe --rr-d*/--rr-l*-Variablen aus getRingStyle(); welche
   Palette gilt, entscheidet der [data-theme]-Block am Ende. Die Zuweisung MUSS
   hier im CSS passieren: Inline-Styles schlagen Stylesheet-Regeln, ein direkt
   gesetztes --rr-c1 wäre im Light Mode nicht mehr überschreibbar.
────────────────────────────────────────────────────────────────────── */

@keyframes rr-rotate {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* Pulsiert nur den Glow, nicht das Element — sonst blinkt das Avatarbild mit. */
@keyframes rr-pulse-glow {
  0%, 100% { box-shadow: 0 0 var(--rr-glow) var(--rr-glow-color); }
  50%      { box-shadow: 0 0 calc(var(--rr-glow) * 1.7) var(--rr-glow-color); }
}

/* Einmaliges Aufflackern beim Rangwechsel. Bewusst über --rr-c2 statt über den
   Glow: Rang 1 hat gar keinen Glow, das Aufflackern muss trotzdem sichtbar sein. */
@keyframes rr-flare {
  0%   { box-shadow: 0 0  0px 0px transparent;       transform: scale(1);    }
  12%  { box-shadow: 0 0 26px 5px var(--rr-c2);      transform: scale(1.10); }
  45%  { box-shadow: 0 0 14px 1px var(--rr-c2);      transform: scale(1);    }
  100% { box-shadow: 0 0  0px 0px transparent;       transform: scale(1);    }
}

.rank-ring {
  /* Fallback (Rang 1), falls getRingStyle() mal nicht mitgeliefert wird */
  --rr-dc1: #3f3f46; --rr-dc2: #a1a1aa; --rr-dc3: #52525b;
  --rr-dglow: 0px;   --rr-dglowc: transparent;
  --rr-lc1: #a1a1aa; --rr-lc2: #3f3f46; --rr-lc3: #71717a;
  --rr-lglow: 0px;   --rr-lglowc: transparent;
  --rr-speed: 12s;

  --rr-c1: var(--rr-dc1);
  --rr-c2: var(--rr-dc2);
  --rr-c3: var(--rr-dc3);
  --rr-glow: var(--rr-dglow);
  --rr-glow-color: var(--rr-dglowc);
  /* Farbe des 1px-Absatzes zwischen Ring und Bild */
  --rr-gap: var(--bg-base, #0d0d0f);

  position: relative;
  isolation: isolate;
}

/* Rotierende Gradient-Schicht. Übergroß + zentriert, damit auch bei eckigen
   Varianten (rounded-lg/2xl) beim Drehen keine Ecke aus der Box wandert;
   das Clipping übernimmt der Layer selbst. */
.rr-ring-layer {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}
.rr-ring-layer::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 142%;
  height: 142%;
  transform: translate(-50%, -50%) rotate(0deg);
  animation: rr-rotate var(--rr-speed) linear infinite;
  will-change: transform;
}

/* Bild-Container. Der outset-Schatten legt die 1px-Haarlinie ÜBER den Ring,
   statt sie vom Bild abzuziehen — so bleibt das Foto in voller Größe. */
   Größe kommt bewusst per Klasse vom Aufrufer — der Dashboard-Avatar nutzt eine
   eigene Cut-Corner-Form, der Listen-Avatar schlicht w-full/h-full. */
.rr-face {
  position: relative;
  z-index: 1;
  overflow: hidden;
  background: var(--rr-gap);
  box-shadow: 0 0 0 1px var(--rr-gap);
}

/* Stufe I — eine einzelne Lichtkeule wandert um den Ring. Kein Glow.
   Die Keule muss breit sein: eine schmale Sichel auf einfarbigem Grund ist bei
   diesen Tempi nicht als Bewegung wahrnehmbar. */
.rr-t1 .rr-ring-layer::before {
  background: conic-gradient(
    var(--rr-c1), var(--rr-c3) 25%, var(--rr-c2) 50%, var(--rr-c3) 75%, var(--rr-c1));
}

/* Stufe II — zweilobig: die Drehung wird eindeutig sichtbar, halber Glow. */
.rr-t2 .rr-ring-layer::before {
  background: conic-gradient(
    var(--rr-c1), var(--rr-c2) 25%, var(--rr-c1) 50%, var(--rr-c2) 75%, var(--rr-c1));
  animation-duration: calc(var(--rr-speed) * 0.75);
}
.rr-t2 { box-shadow: 0 0 calc(var(--rr-glow) * 0.5) var(--rr-glow-color); }

/* Stufe III — voller Verlauf, doppeltes Tempo, voller Glow. */
.rr-t3 .rr-ring-layer::before {
  background: conic-gradient(
    var(--rr-c1), var(--rr-c3) 15%, var(--rr-c2) 30%, var(--rr-c3) 45%,
    var(--rr-c1) 60%, var(--rr-c3) 80%, var(--rr-c2) 90%, var(--rr-c1));
  animation-duration: calc(var(--rr-speed) * 0.5);
}
.rr-t3 { box-shadow: 0 0 var(--rr-glow) var(--rr-glow-color); }

/* Old Master III — einziger Rang mit zusätzlichem Puls. Muss nach .rr-t3 stehen. */
.rr-apex { animation: rr-pulse-glow 2.4s ease-in-out infinite; }

/* Kompakt (< 24px) — nur die Rangfarbe. Muss nach .rr-t1/2/3 stehen.
   Bei 16–20px ist der Verlauf nicht mehr auflösbar, die Stufenform ohnehin nicht lesbar,
   und in dichten Listen würden Dutzende rotierende Ringe gleichzeitig flimmern. */
.rr-flat { box-shadow: none; }
.rr-flat .rr-ring-layer::before {
  background: var(--rr-c3);
  animation: none;
  will-change: auto;
}

/* Aufflackern beim Rangwechsel. Nach .rr-apex, damit es dessen Puls für die Dauer
   der Feier überschreibt; die Klasse wird danach wieder entfernt. */
.rr-flare { animation: rr-flare 1400ms cubic-bezier(0.2, 0.8, 0.2, 1) 1; }

/* Stufenanzeige: 1–3 Punkte, gleiche Notation wie im RankIcon-Hexagon. */
.rr-dots {
  position: absolute;
  left: 50%;
  bottom: -3px;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px 4px;
  border-radius: 999px;
  background: var(--rr-gap);
  box-shadow: 0 0 0 1px var(--rr-c3);
  pointer-events: none;
}
.rr-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--rr-c2);
  opacity: 0.22;
}
.rr-dot--on { opacity: 1; }

/* ── Light Mode ─────────────────────────────────────────────────────
   Umgekehrte Logik: hell trägt der gesättigte Mittelton, nicht der Pastellton. */
[data-theme="light"] .rank-ring {
  --rr-c1: var(--rr-lc1);
  --rr-c2: var(--rr-lc2);
  --rr-c3: var(--rr-lc3);
  --rr-glow: var(--rr-lglow);
  --rr-glow-color: var(--rr-lglowc);
}
</style></head><body>
